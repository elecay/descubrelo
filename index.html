<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descubrelo</title>
<style>
  :root { --bg:#14161c; --card:#1e222b; --line:#323846; --text:#eef0f4; --muted:#98a0b0; --accent:#ffb84d; --ok:#5fd08a; --bad:#f0706a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  h1 { font-size:1.4rem; margin:0; letter-spacing:.02em; }
  #score { color:var(--muted); font-size:.9rem; }
  #hint { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  #category { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 14px; font-size:.9rem; }
  #category b { color:var(--accent); }
  #dots { display:flex; gap:6px; }
  #dots i { width:12px; height:12px; border-radius:50%; background:var(--line); }
  #dots i.used { background:var(--bad); }
  #dots i.now { background:var(--accent); }
  #dots i.win { background:var(--ok); }
  #frame { position:relative; width:100%; aspect-ratio:4/3; overflow:hidden; border-radius:14px; background:#000; border:1px solid var(--line); }
  #img { width:100%; height:100%; object-fit:contain; display:block; transform:scale(1); transition:transform .7s ease; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  #status { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); background:#000; text-align:center; padding:20px; }
  #status[hidden] { display:none; }
  form { display:flex; gap:8px; margin-top:14px; }
  input { flex:1; min-width:0; padding:12px 14px; font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:10px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { padding:12px 16px; font:inherit; font-weight:600; border:0; border-radius:10px; cursor:pointer; background:var(--accent); color:#222; }
  button.ghost { background:var(--card); color:var(--text); border:1px solid var(--line); font-weight:400; }
  button:disabled, input:disabled { opacity:.5; cursor:default; }
  #guesses { list-style:none; padding:0; margin:12px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
  #guesses li { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:3px 10px; font-size:.9rem; color:var(--muted); text-decoration:line-through; }
  #result { margin-top:16px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:14px; text-align:center; }
  #result[hidden] { display:none; }
  #result h2 { margin:0 0 4px; font-size:1.15rem; }
  #result h2.ok { color:var(--ok); } #result h2.bad { color:var(--bad); }
  #answer { font-size:1.5rem; font-weight:700; margin:4px 0 10px; }
  #result a { color:var(--muted); font-size:.85rem; display:block; margin-bottom:14px; }
  footer { margin-top:32px; text-align:center; color:var(--muted); font-size:.85rem; }
  footer a { color:var(--accent); text-decoration:none; }
  footer a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🔍 Descubrelo</h1>
    <span id="score">Score: 0 / 0</span>
  </header>

  <div id="hint">
    <span id="category">Hint: <b>…</b></span>
    <span id="dots" aria-label="Attempts"></span>
  </div>

  <div id="frame">
    <img id="img" alt="Mystery image">
    <div id="status">Loading image…</div>
  </div>

  <form id="form" autocomplete="off">
    <input id="guess" placeholder="What is it?" aria-label="Your guess" autocapitalize="off" spellcheck="false">
    <button id="send">Guess</button>
    <button id="pass" type="button" class="ghost" title="Use up an attempt to zoom out">Pass</button>
  </form>
  <ul id="guesses"></ul>

  <div id="result" hidden>
    <h2 id="verdict"></h2>
    <div id="answer"></div>
    <a id="source" target="_blank" rel="noopener">View on Wikipedia</a>
    <button id="next">Next image →</button>
  </div>

  <footer>Built with ❤️ by <s>Claude</s> <a href="https://github.com/elecay" target="_blank" rel="noopener">elecay</a></footer>
</main>

<script>
// Each theme lists seed Wikipedia categories. Members (and, if a seed is too
// thin, a sample of its subcategories' members) are fetched live and cached
// for the session, so no per-article list is kept here.
const CATEGORIES = {
  "Animal": ["Penguins", "Big cats", "Flightless birds", "Birds of prey", "Hummingbirds", "Parrots", "Owls", "Sharks", "Butterflies", "Elephants"],
  "Building or monument": ["Castles", "Palaces", "Pyramids", "Mosques", "Cathedrals", "Triumphal arches", "Monasteries", "Opera houses"],
  "Landscape or natural phenomenon": ["Active volcanoes", "Waterfalls", "Deserts", "Glaciers", "Caves", "Fjords", "Geysers", "Salt flats", "Coral reefs", "Lakes", "Rock formations"],
  "Food": ["Street food", "Desserts", "Pasta", "Sandwiches", "Soups", "Breads", "Noodles", "Pizza", "Pastries", "Rice dishes", "Dumplings"],
  "Fruit or plant": ["Garden plants", "Citrus", "Melons", "Berries"],
  "Object": ["Hand tools", "Bicycles", "String instruments", "Keyboard instruments", "Hats", "Furniture", "Boats"]
};

// Concrete off-topic titles observed while surveying the categories above
// (e.g. a chess piece under Castles, a car rally under Deserts) — excluded
// by exact match rather than guessing at a general pattern.
const BAD_TITLES = new Set([
  "howdah pistol", "elephant joke", "elephants' graveyard", "project elephant",
  "rook (chess)", "beer can pyramid", "human pyramid", "square pyramidal number",
  "jean-pierre houdin", "the critical eye", "dakar rally", "coral reefs",
  "world pizza championship", "history of pizza", "pizza delivery", "pizza cutter",
  "soup kitchen", "alphitomancy"
]);

const ZOOMS = [10, 6, 3.5, 2, 1];   // one level per attempt; the fifth shows the full image
const MAX = ZOOMS.length;
const API = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1" +
            "&prop=pageimages|redirects&piprop=thumbnail&pithumbsize=960&rdlimit=20&titles=";

const $ = id => document.getElementById(id);
let round = null, attempt = 0, over = false, wins = 0, played = 0;
const used = new Set();        // page titles already shown this session
const poolCache = {};          // seed category name -> array of candidate titles

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Skip meta/list articles that slip into category membership.
function isUsablePageTitle(title) {
  return !/^(List of|Lists of|Index of|Outline of|Timeline of|Glossary of|Comparison of)\b/i.test(title)
      && !/\(disambiguation\)$/i.test(title)
      && !BAD_TITLES.has(title.toLowerCase());
}

// Only keep short, plain-text redirects as guessable aliases.
function isUsableAlias(title) {
  return /^[A-Za-z][A-Za-z' .-]*$/.test(title) && title.trim().split(/\s+/).length <= 4;
}

// --- Popularity check (Wikipedia Pageviews API) -----------------------------
// Category members are a mix of famous and obscure articles (e.g. "Waterfalls"
// includes both Niagara Falls and some stream two towns over). Rather than
// pre-checking a whole pool (one request per member — easily a flood of
// requests and a good way to get rate-limited), we check only the single
// candidate a round actually wants, and reject-and-retry if it's obscure.
const MIN_MONTHLY_VIEWS = 3000;

function lastFullMonthRange() {
  const now = new Date();
  const end = new Date(now.getFullYear(), now.getMonth(), 1);
  const start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const fmt = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}0100`;
  return { start: fmt(start), end: fmt(end) };
}

async function monthlyViews(title) {
  const { start, end } = lastFullMonthRange();
  const url = "https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/user/" +
              encodeURIComponent(title.replace(/ /g, "_")) + "/monthly/" + start + "/" + end;
  try {
    const res = await fetch(url);
    if (!res.ok) return 0;
    const data = await res.json();
    return (data.items || []).reduce((sum, i) => sum + i.views, 0);
  } catch {
    return 0;
  }
}

// --- Category membership (fetched live, cached per seed) -------------------
async function categoryMembers(categoryName, type) {
  const ns = type === "page" ? "&gcmnamespace=0" : "";
  const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*" +
              "&generator=categorymembers&gcmtype=" + type + ns + "&gcmlimit=500" +
              "&gcmtitle=" + encodeURIComponent("Category:" + categoryName);
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const pages = data.query && data.query.pages;
  return pages ? Object.values(pages).map(p => p.title) : [];
}

// Top-level categories are often mostly subcategories (e.g. Category:Mammals
// holds almost no articles directly), so when a seed is thin we sample a few
// of its subcategories' members too.
async function getCategoryPool(categoryName) {
  if (poolCache[categoryName]) return poolCache[categoryName];
  let pool = (await categoryMembers(categoryName, "page")).filter(isUsablePageTitle);
  if (pool.length < 20) {
    const subcats = shuffleArray(await categoryMembers(categoryName, "subcat"));
    for (const subcat of subcats.slice(0, 6)) {
      const members = await categoryMembers(subcat.replace(/^Category:/, ""), "page");
      pool = pool.concat(members.filter(isUsablePageTitle));
      if (pool.length >= 40) break;
    }
  }
  poolCache[categoryName] = pool;
  return pool;
}

async function pickCandidate(requirePopular) {
  const themes = Object.keys(CATEGORIES);
  const theme = themes[Math.floor(Math.random() * themes.length)];
  const cats = CATEGORIES[theme];
  const categoryName = cats[Math.floor(Math.random() * cats.length)];
  const pool = await getCategoryPool(categoryName);
  if (!pool.length) return null;
  const fresh = pool.filter(t => !used.has(t));
  const options = fresh.length ? fresh : pool;   // allow repeats once a pool is exhausted
  const title = options[Math.floor(Math.random() * options.length)];
  if (requirePopular && await monthlyViews(title) < MIN_MONTHLY_VIEWS) {
    used.add(title);   // too obscure — don't offer it again this session
    return null;
  }
  return { category: theme, title };
}

// --- Forgiving comparison ---------------------------------------------------
function norm(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/['’]/g, "").replace(/[^a-z0-9]+/g, " ").trim()
    .split(" ").filter(w => !["the", "a", "an"].includes(w)).join(" ");
}
function lev(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}
// Per-word typo tolerance, scaled to word length (so a one-letter slip on a
// long word still passes, but short words still need to be close).
function wordTol(w) {
  return w.length < 5 ? 0 : w.length < 8 ? 1 : 2;
}
function isMatch(guess, answers) {
  const g = norm(guess);
  if (!g) return false;
  const gWords = g.split(" ").filter(w => w.length >= 3);
  return answers.some(raw => {
    const a = norm(raw);
    const tol = a.length < 5 ? 0 : a.length < 9 ? 1 : 2;
    if (lev(g, a) <= tol) return true;
    if (lev(g.replace(/ /g, ""), a.replace(/ /g, "")) <= tol) return true;
    if ((" " + g + " ").includes(" " + a + " ")) return true;   // "a giant panda bear" contains "giant panda"
    // One matching word is enough — typos/grammar on the rest don't count
    // against the guess (e.g. "pandas" or "a panda" for "Giant panda").
    const aWords = a.split(" ").filter(w => w.length >= 3);
    return gWords.some(gw => aWords.some(aw => lev(gw, aw) <= wordTol(aw)));
  });
}

// --- Image loading from Wikipedia -----------------------------------------
async function fetchImage(item) {
  const res = await fetch(API + encodeURIComponent(item.title));
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const page = Object.values(data.query.pages)[0];
  const src = page && page.thumbnail && page.thumbnail.source;
  if (!src || /\.svg/i.test(src)) return null;           // no photo, or a diagram/logo
  await new Promise((ok, fail) => {
    const probe = new Image();
    probe.onload = ok; probe.onerror = fail; probe.src = src;
  });
  const redirects = (page.redirects || []).map(r => r.title).filter(isUsableAlias);
  const answers = [page.title, ...redirects];
  return { src, ratio: page.thumbnail.width / page.thumbnail.height, pageTitle: page.title, answers };
}

async function newRound() {
  over = true;
  $("result").hidden = true;
  $("status").hidden = false;
  $("status").textContent = "Loading image…";
  $("guesses").innerHTML = "";
  $("category").innerHTML = "Hint: <b>…</b>";
  setInputs(false);

  let networkErrors = 0;
  for (let tries = 0; tries < 20; tries++) {
    try {
      // Give up on the popularity requirement for the last few tries, so a
      // thin category (e.g. "Hats") can never make the round fail outright.
      const candidate = await pickCandidate(tries < 15);
      if (!candidate) continue;
      const image = await fetchImage(candidate);
      if (image) {
        used.add(image.pageTitle);
        return startRound(candidate, image);
      }
    } catch (e) {
      if (++networkErrors >= 3) break;
    }
  }
  $("status").innerHTML = "Could not load an image from Wikipedia.<br>Check your connection and press “Next image”.";
  $("result").hidden = false;
  $("verdict").textContent = ""; $("answer").textContent = ""; $("source").hidden = true;
}

function startRound(item, image) {
  round = { ...item, ...image };
  attempt = 0; over = false;
  const img = $("img");
  img.style.transition = "none";               // no animation, so the full image never flashes on load
  img.style.transform = `scale(${ZOOMS[0]})`;
  img.src = image.src;
  $("frame").style.aspectRatio = Math.min(1.6, Math.max(0.8, image.ratio));
  void img.offsetWidth;
  img.style.transition = "";
  $("category").innerHTML = "Hint: <b></b>";
  $("category").querySelector("b").textContent = item.category;
  $("status").hidden = true;
  setInputs(true);
  renderDots();
  $("guess").value = "";
  $("guess").focus();
}

function setInputs(on) {
  $("guess").disabled = $("send").disabled = $("pass").disabled = !on;
}

function renderDots(won) {
  $("dots").innerHTML = ZOOMS.map((_, i) => {
    const cls = won && i === attempt ? "win" : i < attempt ? "used" : (i === attempt && !over) ? "now" : "";
    return `<i class="${cls}"></i>`;
  }).join("");
}

function play(text) {
  if (over) return;
  if (text && isMatch(text, round.answers)) return finish(true);
  const li = document.createElement("li");
  li.textContent = text || "—";
  $("guesses").appendChild(li);
  attempt++;
  if (attempt >= MAX) return finish(false);
  $("img").style.transform = `scale(${ZOOMS[attempt]})`;
  renderDots();
  $("guess").value = "";
  $("guess").focus();
}

function finish(won) {
  over = true;
  played++; if (won) wins++;
  $("img").style.transform = "scale(1)";
  renderDots(won);
  setInputs(false);
  $("score").textContent = `Score: ${wins} / ${played}`;
  $("verdict").textContent = won ? `Correct! On attempt ${attempt + 1} of ${MAX}` : "Out of attempts. It was:";
  $("verdict").className = won ? "ok" : "bad";
  $("answer").textContent = round.answers[0].replace(/^./, c => c.toUpperCase());
  $("source").hidden = false;
  $("source").href = "https://en.wikipedia.org/wiki/" + encodeURIComponent(round.pageTitle.replace(/ /g, "_"));
  $("result").hidden = false;
  $("next").focus();
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("guess").value.trim();
  if (text) play(text);
});
$("pass").addEventListener("click", () => play(""));
$("next").addEventListener("click", newRound);

newRound();
</script>
</body>
</html>
