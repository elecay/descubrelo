<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descúbrelo</title>
<style>
  :root { --bg:#14161c; --card:#1e222b; --line:#323846; --text:#eef0f4; --muted:#98a0b0; --accent:#ffb84d; --ok:#5fd08a; --bad:#f0706a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  h1 { font-size:1.4rem; margin:0; letter-spacing:.02em; }
  #score { color:var(--muted); font-size:.9rem; }
  #hint { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  #category { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 14px; font-size:.9rem; }
  #category b { color:var(--accent); }
  #dots { display:flex; gap:6px; }
  #dots i { width:12px; height:12px; border-radius:50%; background:var(--line); }
  #dots i.used { background:var(--bad); }
  #dots i.now { background:var(--accent); }
  #dots i.win { background:var(--ok); }
  #frame { position:relative; width:100%; aspect-ratio:4/3; overflow:hidden; border-radius:14px; background:#000; border:1px solid var(--line); }
  #img { width:100%; height:100%; object-fit:contain; display:block; transform:scale(1); transition:transform .7s ease; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  #status { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); background:#000; text-align:center; padding:20px; }
  #status[hidden] { display:none; }
  form { display:flex; gap:8px; margin-top:14px; }
  input { flex:1; min-width:0; padding:12px 14px; font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:10px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { padding:12px 16px; font:inherit; font-weight:600; border:0; border-radius:10px; cursor:pointer; background:var(--accent); color:#222; }
  button.ghost { background:var(--card); color:var(--text); border:1px solid var(--line); font-weight:400; }
  button:disabled, input:disabled { opacity:.5; cursor:default; }
  #guesses { list-style:none; padding:0; margin:12px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
  #guesses li { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:3px 10px; font-size:.9rem; color:var(--muted); text-decoration:line-through; }
  #result { margin-top:16px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:14px; text-align:center; }
  #result[hidden] { display:none; }
  #result h2 { margin:0 0 4px; font-size:1.15rem; }
  #result h2.ok { color:var(--ok); } #result h2.bad { color:var(--bad); }
  #answer { font-size:1.5rem; font-weight:700; margin:4px 0 10px; }
  #result a { color:var(--muted); font-size:.85rem; display:block; margin-bottom:14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🔍 Descúbrelo</h1>
    <span id="score">Aciertos: 0 / 0</span>
  </header>

  <div id="hint">
    <span id="category">Pista: <b>…</b></span>
    <span id="dots" aria-label="Intentos"></span>
  </div>

  <div id="frame">
    <img id="img" alt="Imagen misteriosa">
    <div id="status">Cargando imagen…</div>
  </div>

  <form id="form" autocomplete="off">
    <input id="guess" placeholder="¿Qué es?" aria-label="Tu respuesta" autocapitalize="off" spellcheck="false">
    <button id="send">Probar</button>
    <button id="pass" type="button" class="ghost" title="Gastar un intento para alejar el zoom">Paso</button>
  </form>
  <ul id="guesses"></ul>

  <div id="result" hidden>
    <h2 id="verdict"></h2>
    <div id="answer"></div>
    <a id="source" target="_blank" rel="noopener">Ver en Wikipedia</a>
    <button id="next">Siguiente imagen →</button>
  </div>
</main>

<script>
// Cada entrada: "Título en Wikipedia" o "Título en Wikipedia:respuesta,alias,alias".
// La primera respuesta es la que se muestra al final. Las imágenes se piden a Wikipedia en cada partida.
const ITEMS = {

    "Phascolarctos cinereus:koala", "Delphinidae:delfín", "Ursus maritimus:oso polar,oso",
    "Phoenicopterus:flamenco", "Macropus:canguro", "Hippopotamus amphibius:hipopótamo", "Camelus:camello,dromedario",
    "Pavo cristatus:pavo real", "Crocodylidae:cocodrilo,caimán", "Gorilla:gorila", "Canis lupus:lobo",
    "Vulpes vulpes:zorro", "Octopoda:pulpo", "Testudines:tortuga", "Strigiformes:búho,lechuza",
    "Lepidoptera:mariposa,polilla", "Apis mellifera:abeja", "Chamaeleonidae:camaleón",
    "Rhinocerotidae:rinoceronte", "Sciurus vulgaris:ardilla", "Erinaceinae:erizo",
    "Ara macao:guacamayo,loro,papagayo", "Acinonyx jubatus:guepardo,chita", "Ramphastos toco:tucán",
    "Medusozoa:medusa", "Selachimorpha:tiburón", "Lama glama:llama", "Bradypus:perezoso"
  ],
  "Edificio o monumento": [
    "Torre Eiffel", "Coliseo:coliseo,coliseo romano,coliseo de roma", "Taj Mahal", "Estatua de la Libertad",
    "Sagrada Familia", "Big Ben", "Torre de Pisa:torre de pisa,pisa", "Ópera de Sídney:ópera de sídney,opera de sydney",
    "Machu Picchu", "Partenón:partenón,acrópolis", "Gran Muralla China:gran muralla china,muralla china,gran muralla",
    "Cristo Redentor:cristo redentor,cristo de corcovado,corcovado", "Burj Khalifa",
    "Empire State Building:empire state building,empire state", "Puente Golden Gate:golden gate,puente golden gate",
    "Alhambra", "Petra", "Stonehenge", "Chichén Itzá", "Angkor Wat",
    "Catedral de San Basilio:catedral de san basilio,san basilio",
    "Castillo de Neuschwanstein:castillo de neuschwanstein,neuschwanstein", "Torres Petronas:torres petronas,petronas",
    "Puerta de Brandeburgo", "Acueducto de Segovia", "Mezquita-catedral de Córdoba:mezquita de córdoba,mezquita",
    "Casa Blanca", "Kremlin de Moscú:kremlin,kremlin de moscú",
    "Necrópolis de Guiza:pirámides de guiza,pirámides,pirámide,pirámides de giza,pirámides de egipto",
    "Gran Esfinge de Guiza:esfinge,gran esfinge,esfinge de guiza,esfinge de giza",
    "Puente de la Torre:tower bridge,puente de la torre,puente de londres", "Atomium",
    "Museo Guggenheim Bilbao:museo guggenheim,guggenheim,guggenheim bilbao", "Moái:moái,moais,isla de pascua",
    "Monte Rushmore:monte rushmore,rushmore", "Arco de Triunfo de París:arco de triunfo,arco del triunfo",
    "Basílica de San Pedro:basílica de san pedro,san pedro,vaticano", "Santa Sofía:santa sofía,hagia sophia",
    "Palacio de Versalles:palacio de versalles,versalles", "London Eye:london eye,noria,noria de londres"
  ],
  "Paisaje o fenómeno natural": [
    "Gran Cañón:gran cañón,gran cañón del colorado,cañón del colorado", "Monte Everest:everest,monte everest",
    "Cataratas del Iguazú:cataratas del iguazú,iguazú,cataratas", "Cataratas del Niágara:cataratas del niágara,niágara,cataratas",
    "Monte Fuji:monte fuji,fuji,fujiyama", "Cervino:cervino,matterhorn", "Salar de Uyuni:salar de uyuni,uyuni,salar",
    "Uluru:uluru,ayers rock", "Bahía de Ha-Long:bahía de ha long,ha long,halong",
    "Glaciar Perito Moreno:glaciar perito moreno,perito moreno,glaciar", "Kilimanjaro", "Torres del Paine",
    "Salto Ángel", "Mar Muerto", "Aurora polar:aurora boreal,aurora,aurora polar,aurora austral",
    "Gran Barrera de Coral:gran barrera de coral,barrera de coral,arrecife", "Teide",
    "Calzada del Gigante:calzada del gigante,calzada de los gigantes", "Cañón del Antílope", "Capadocia",
    "Monument Valley", "Parque nacional de Yosemite:yosemite",
    "Volcán", "Glaciar", "Iceberg", "Duna:duna,dunas,desierto", "Géiser", "Arcoíris:arcoíris,arco iris",
    "Cascada:cascada,catarata,salto de agua", "Fiordo", "Tornado", "Rayo:rayo,relámpago,tormenta"
  ],
  "Comida": [
    "Pizza", "Paella", "Sushi", "Hamburguesa", "Cruasán:cruasán,croissant,medialuna", "Taco",
    "Tortilla de patatas:tortilla de patatas,tortilla,tortilla española,tortilla de papas", "Churro:churros,churro",
    "Helado", "Espagueti:espaguetis,spaghetti,pasta", "Lasaña", "Ceviche:ceviche,cebiche", "Empanada", "Guacamole",
    "Gofre:gofre,waffle,wafle", "Pretzel:pretzel,bretzel", "Dónut:dónut,dona,rosquilla,donuts", "Macaron:macaron,macarrón",
    "Ramen", "Perrito caliente:perrito caliente,hot dog,pancho,perro caliente",
    "Palomitas de maíz:palomitas,palomitas de maíz,pochoclo,canguil,popcorn,cotufas", "Queso", "Chocolate", "Pan",
    "Tiramisú", "Falafel", "Arepa", "Tamal", "Burrito", "Nachos", "Panqueque:panqueque,tortita,pancake,crepe,hotcake",
    "Huevo frito", "Croqueta", "Gazpacho", "Fondue", "Kebab"
  ],
  "Fruta o planta": [
    "Ananas comosus:piña,ananá,ananás", "Fragaria:fresa,frutilla", "Sandía", "Actinidia deliciosa:kiwi",
    "Punica granatum:granada", "Helianthus annuus:girasol", "Cactaceae:cactus,cacto", "Persea americana:aguacate,palta",
    "Banana:plátano,banana,banano", "Limón", "Cocos nucifera:coco,cocotero,palmera", "Tulipa:tulipán",
    "Lavandula:lavanda", "Pitahaya:pitahaya,pitaya,fruta del dragón", "Cynara scolymus:alcachofa,alcaucil",
    "Zea mays:maíz,choclo,mazorca,elote", "Mangifera indica:mango", "Uva:uva,uvas", "Cereza:cereza,cerezas",
    "Frambuesa", "Higo", "Carica papaya:papaya", "Calabaza:calabaza,zapallo", "Brócoli",
    "Amanita muscaria:seta,hongo,amanita", "Bambusoideae:bambú", "Orchidaceae:orquídea",
    "Taraxacum officinale:diente de león", "Bonsái", "Solanum lycopersicum:tomate,jitomate", "Allium sativum:ajo",
    "Prunus persica:melocotón,durazno", "Arándano:arándano,arándanos"
  ],
  "Objeto": [
    "Paraguas:paraguas,sombrilla", "Bicicleta:bicicleta,bici", "Guitarra", "Piano", "Violín", "Saxofón:saxofón,saxo",
    "Batería (instrumento musical):batería,tambores,tambor", "Trompeta", "Acordeón", "Arpa", "Reloj de arena",
    "Brújula", "Telescopio", "Microscopio", "Globo aerostático:globo aerostático,globo",
    "Cubo de Rubik:cubo de rubik,rubik,cubo mágico", "Máquina de escribir", "Ajedrez:ajedrez,tablero de ajedrez",
    "Lámpara incandescente:bombilla,foco,lámpara,bombillo,ampolleta", "Tijera:tijeras,tijera", "Candado", "Ancla",
    "Linterna", "Cámara fotográfica:cámara,cámara de fotos,cámara fotográfica", "Gramófono:gramófono,tocadiscos,fonógrafo",
    "Helicóptero", "Submarino", "Tranvía", "Locomotora de vapor:locomotora,tren,locomotora de vapor", "Velero:velero,barco",
    "Motocicleta:moto,motocicleta", "Monopatín:monopatín,skate,patineta,skateboard", "Dado:dado,dados", "Yoyó:yoyó,yo-yo",
    "Cometa (juguete):cometa,barrilete,papalote,volantín", "Abanico", "Bumerán:bumerán,boomerang",
    "Muñeca rusa:matrioska,muñeca rusa,matrioshka,mamushka", "Faro", "Molino de viento:molino de viento,molino",
    "Tetera", "Sacacorchos:sacacorchos,descorchador", "Globo terráqueo:globo terráqueo,globo,bola del mundo,mapamundi"
  ]
};

const ZOOMS = [10, 6, 3.5, 2, 1];   // un nivel por intento; el quinto muestra la imagen completa
const MAX = ZOOMS.length;
const API = "https://es.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1" +
            "&prop=pageimages&piprop=thumbnail&pithumbsize=960&titles=";

const $ = id => document.getElementById(id);
let deck = [], round = null, attempt = 0, over = false, wins = 0, played = 0;

function buildDeck() {
  const all = [];
  for (const [category, list] of Object.entries(ITEMS)) {
    for (const entry of list) {
      const [title, rest] = entry.split(":");
      all.push({ category, title, answers: (rest || title).split(",") });
    }
  }
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  return all;
}

// --- Comparación tolerante -------------------------------------------------
function norm(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, " ").trim()
    .split(" ").filter(w => !["el", "la", "los", "las", "un", "una", "unos", "unas"].includes(w)).join(" ");
}
function lev(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}
function isMatch(guess, answers) {
  const g = norm(guess);
  if (!g) return false;
  return answers.some(raw => {
    const a = norm(raw);
    const tol = a.length < 5 ? 0 : a.length < 9 ? 1 : 2;
    return lev(g, a) <= tol
        || lev(g.replace(/ /g, ""), a.replace(/ /g, "")) <= tol
        || (" " + g + " ").includes(" " + a + " ");   // "un oso panda gigante" contiene "oso panda"
  });
}

// --- Carga de imagen desde Wikipedia ---------------------------------------
async function fetchImage(item) {
  const res = await fetch(API + encodeURIComponent(item.title));
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const page = Object.values(data.query.pages)[0];
  const src = page && page.thumbnail && page.thumbnail.source;
  if (!src || /\.svg/i.test(src)) return null;           // sin foto, o es un diagrama/logo
  await new Promise((ok, fail) => {
    const probe = new Image();
    probe.onload = ok; probe.onerror = fail; probe.src = src;
  });
  return { src, ratio: page.thumbnail.width / page.thumbnail.height, pageTitle: page.title };
}

async function newRound() {
  over = true;
  $("result").hidden = true;
  $("status").hidden = false;
  $("status").textContent = "Cargando imagen…";
  $("guesses").innerHTML = "";
  $("category").innerHTML = "Pista: <b>…</b>";
  setInputs(false);

  let networkErrors = 0;
  for (let tries = 0; tries < 12; tries++) {
    if (!deck.length) deck = buildDeck();
    const item = deck.pop();
    try {
      const image = await fetchImage(item);
      if (image) return startRound(item, image);
    } catch (e) {
      if (++networkErrors >= 3) break;
    }
  }
  $("status").innerHTML = "No se pudo cargar una imagen de Wikipedia.<br>Revisa tu conexión y pulsa «Siguiente».";
  $("result").hidden = false;
  $("verdict").textContent = ""; $("answer").textContent = ""; $("source").hidden = true;
}

function startRound(item, image) {
  round = { ...item, ...image };
  attempt = 0; over = false;
  const img = $("img");
  img.style.transition = "none";               // sin animación: que no se vea la imagen entera al cargar
  img.style.transform = `scale(${ZOOMS[0]})`;
  img.src = image.src;
  $("frame").style.aspectRatio = Math.min(1.6, Math.max(0.8, image.ratio));
  void img.offsetWidth;
  img.style.transition = "";
  $("category").innerHTML = "Pista: <b></b>";
  $("category").querySelector("b").textContent = item.category;
  $("status").hidden = true;
  setInputs(true);
  renderDots();
  $("guess").value = "";
  $("guess").focus();
}

function setInputs(on) {
  $("guess").disabled = $("send").disabled = $("pass").disabled = !on;
}

function renderDots(won) {
  $("dots").innerHTML = ZOOMS.map((_, i) => {
    const cls = won && i === attempt ? "win" : i < attempt ? "used" : (i === attempt && !over) ? "now" : "";
    return `<i class="${cls}"></i>`;
  }).join("");
}

function play(text) {
  if (over) return;
  if (text && isMatch(text, round.answers)) return finish(true);
  const li = document.createElement("li");
  li.textContent = text || "—";
  $("guesses").appendChild(li);
  attempt++;
  if (attempt >= MAX) return finish(false);
  $("img").style.transform = `scale(${ZOOMS[attempt]})`;
  renderDots();
  $("guess").value = "";
  $("guess").focus();
}

function finish(won) {
  over = true;
  played++; if (won) wins++;
  $("img").style.transform = "scale(1)";
  renderDots(won);
  setInputs(false);
  $("score").textContent = `Aciertos: ${wins} / ${played}`;
  $("verdict").textContent = won ? `¡Correcto! Al intento ${attempt + 1} de ${MAX}` : "Se acabaron los intentos. Era:";
  $("verdict").className = won ? "ok" : "bad";
  $("answer").textContent = round.answers[0].replace(/^./, c => c.toUpperCase());
  $("source").hidden = false;
  $("source").href = "https://es.wikipedia.org/wiki/" + encodeURIComponent(round.pageTitle.replace(/ /g, "_"));
  $("result").hidden = false;
  $("next").focus();
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("guess").value.trim();
  if (text) play(text);
});
$("pass").addEventListener("click", () => play(""));
$("next").addEventListener("click", newRound);

newRound();
</script>
</body>
</html>
